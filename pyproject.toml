[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-skill"
version = "0.1.0"
description = "Evidence-decoupled visual transition credit assignment for procedural skill evolution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
models = ["openai>=1.0"]

[tool.setuptools.packages.find]
include = ["vista_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
